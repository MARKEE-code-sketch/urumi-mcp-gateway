{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend, urumi.dev/gateway: "true"}
    spec:
      serviceAccountName: {{ .Values.platformAccess.serviceAccount }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: {{ if .Values.backend.image.digest }}{{ printf "%s@%s" .Values.backend.image.repository .Values.backend.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [python, -m, backend.main]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: {{ .Release.Name }}-backend}}]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.platformDb.existingSecret }}, key: password}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.backend.existingProviderSecret }}, key: api-key}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {{ toJson .Values.backend.resources }}
{{- end }}
