{{- if .Values.store.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mariadb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
spec:
  serviceName: {{ .Release.Name }}-mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mariadb
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: {{ .Values.store.databaseImage | quote }}
          ports:
            - containerPort: 3306
          env:
            - {name: MARIADB_DATABASE, value: woocommerce}
            - {name: MARIADB_USER, value: woocommerce}
            - {name: MARIADB_PASSWORD_FILE, value: /run/urumi/database/database-password}
            - {name: MARIADB_ROOT_PASSWORD_FILE, value: /run/urumi/database/root-password}
          resources:
            {{- toYaml .Values.store.resources.database | nindent 12 }}
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: database, mountPath: /run/urumi/database, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mariadb-data
        - name: database
          secret:
            secretName: {{ .Values.store.secrets.database }}
{{- end }}
