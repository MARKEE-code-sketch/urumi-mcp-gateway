{{- if .Values.store.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  ingressClassName: {{ .Values.store.ingress.className }}
  {{- if .Values.store.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.store.ingress.host | quote }}]
      secretName: {{ .Values.store.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.store.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port:
                  number: 80
{{- end }}
