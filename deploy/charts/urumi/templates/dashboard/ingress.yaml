{{- if and .Values.release.enabled .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  ingressClassName: {{ .Values.dashboard.ingress.className }}
  tls:
    - hosts: [{{ .Values.dashboard.ingress.host | quote }}]
      secretName: {{ .Values.dashboard.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.dashboard.ingress.host }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}}
          - path: /mcp
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-dashboard, port: {number: 80}}}
{{- end }}
