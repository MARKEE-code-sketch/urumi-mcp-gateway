{{- if .Values.platformAccess.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.platformAccess.secretNamespace }}
  labels: {urumi-module: m5, urumi-owner: {{ .Release.Name }}}
  annotations: {helm.sh/resource-policy: keep}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.platformAccess.serviceAccount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-upstream-secrets
  namespace: {{ .Values.platformAccess.secretNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-upstream-secrets
  namespace: {{ .Values.platformAccess.secretNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.platformAccess.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-upstream-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
