{{- if .Values.m5Harness.enabled }}
{{- if not (and .Values.platformDb.enabled .Values.platformAccess.enabled) }}
{{- fail "The isolated M5 harness requires platformDb and platformAccess." }}
{{- end }}
{{- if .Values.m5Harness.localHttp }}
{{- fail "The cluster M5 harness requires Secure cookies; local HTTP is only supported by the loopback host harness." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-m5-harness
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
    spec:
      serviceAccountName: {{ .Values.platformAccess.serviceAccount }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.m5Harness.image.repository .Values.m5Harness.image.tag | quote }}
          imagePullPolicy: {{ .Values.m5Harness.image.pullPolicy }}
          command: [python, -m, scripts.m5.harness]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: PGHOST, value: {{ printf "%s-platform-db" .Release.Name | quote }}}
            - {name: PGPORT, value: "5432"}
            - {name: PGUSER, value: urumi}
            - {name: PGDATABASE, value: urumi}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.platformDb.existingSecret }}, key: password}
            - {name: M5_ORIGIN, value: {{ .Values.m5Harness.origin | quote }}}
            - {name: M5_LOCAL_HTTP, value: {{ ternary "true" "false" .Values.m5Harness.localHttp | quote }}}
            - {name: M5_SECRET_NAMESPACE, value: {{ .Values.platformAccess.secretNamespace | quote }}}
            - {name: M5_INTERNAL_URLS, value: {{ .Values.m5Harness.internalUrls | toJson | quote }}}
            - {name: M5_LISTEN_HOST, value: "0.0.0.0"}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.m5Harness.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-m5-harness
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: backend}
  ports: [{name: http, port: 8000, targetPort: http}]
{{- end }}
