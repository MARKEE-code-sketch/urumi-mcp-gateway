<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1640" viewBox="0 0 1000 1640" role="img" aria-labelledby="title desc">
  <title id="title">Urumi Team MCP Gateway architecture</title>
  <desc id="desc">A vertical diagram showing team members and an MCP client entering the Kubernetes cluster through Ingress. The dashboard and external clients reach one gateway backend. The backend calls three internal MCP servers. The WooCommerce MCP server talks to the WooCommerce store. The backend stores team and audit data and reads credentials from Kubernetes Secrets.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#57738f"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#147d78"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60758a; }
      .group-title { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; fill: #60758a; }
      .card-title { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; fill: #49627a; }
      .small { font-size: 14px; fill: #49627a; }
      .label { font-size: 14px; font-weight: 600; fill: #49627a; }
      .ingress-title { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .ingress-subtitle { font-size: 16px; fill: #e5eef5; }
      .connector { fill: none; stroke: #57738f; stroke-width: 3; }
      .line { fill: none; stroke: #57738f; stroke-width: 3; marker-end: url(#arrow); }
      .line-teal { fill: none; stroke: #147d78; stroke-width: 3; marker-end: url(#arrowTeal); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1000" height="1640" fill="#f5f8fb"/>
  <text x="500" y="54" text-anchor="middle" class="title">One gateway. Three MCP servers.</text>
  <text x="500" y="83" text-anchor="middle" class="subtitle">The gateway is the only path from team clients to upstream tools.</text>

  <rect x="55" y="112" width="890" height="190" rx="24" fill="#e8f0f8" stroke="#d1dfec" stroke-width="2"/>
  <text x="82" y="145" class="group-title">PEOPLE AND CLIENTS</text>
  <rect x="95" y="170" width="360" height="92" rx="16" fill="#ffffff" stroke="#bdd0e0" stroke-width="2"/>
  <text x="275" y="207" text-anchor="middle" class="card-title">Admin / team member</text>
  <text x="275" y="235" text-anchor="middle" class="body">Uses the dashboard and chat</text>
  <rect x="545" y="170" width="360" height="92" rx="16" fill="#ffffff" stroke="#bdd0e0" stroke-width="2"/>
  <text x="725" y="207" text-anchor="middle" class="card-title">External MCP client</text>
  <text x="725" y="235" text-anchor="middle" class="body">Uses gateway URL + member key</text>

  <path d="M 275 302 L 275 340 L 500 340" class="connector"/>
  <path d="M 725 302 L 725 340 L 500 340" class="connector"/>

  <rect x="40" y="365" width="920" height="1230" rx="30" fill="#ffffff" stroke="#bacbd9" stroke-width="3"/>
  <rect x="40" y="365" width="920" height="64" rx="28" fill="#eaf1f6"/>
  <path d="M 40 429 H 960" stroke="#bacbd9" stroke-width="2"/>
  <text x="75" y="406" class="group-title">KUBERNETES CLUSTER</text>

  <rect x="245" y="455" width="510" height="105" rx="18" fill="#244c70"/>
  <text x="500" y="497" text-anchor="middle" class="ingress-title">Ingress · the web front door</text>
  <text x="500" y="528" text-anchor="middle" class="ingress-subtitle">Routes store, dashboard, API, and /mcp URLs</text>
  <path d="M 500 340 L 500 450" class="line"/>
  <path d="M 245 510 L 55 510 L 55 1175 L 65 1175" class="line"/>

  <path d="M 500 560 L 500 585 L 280 585 L 280 615" class="line"/>
  <path d="M 500 585 L 710 585 L 710 615" class="line"/>
  <rect x="75" y="615" width="410" height="140" rx="20" fill="#edf5ff" stroke="#bdd4ea" stroke-width="2"/>
  <text x="280" y="659" text-anchor="middle" class="card-title">React dashboard</text>
  <text x="280" y="690" text-anchor="middle" class="body">Servers · members · audit log · chat</text>
  <text x="280" y="720" text-anchor="middle" class="small">Chat calls use the signed-in member's identity</text>

  <rect x="515" y="615" width="390" height="180" rx="20" fill="#e9f6f4" stroke="#a8d3cd" stroke-width="2"/>
  <text x="710" y="658" text-anchor="middle" class="card-title">Gateway backend</text>
  <text x="710" y="690" text-anchor="middle" class="body">Login · roles · chat · one MCP endpoint</text>
  <text x="710" y="720" text-anchor="middle" class="body">Checks keys · routes tools · writes audit</text>
  <text x="710" y="758" text-anchor="middle" class="small">Upstream credentials stay server-side</text>
  <path d="M 485 685 L 510 685" class="line-teal"/>
  <text x="498" y="668" text-anchor="middle" class="label">API / chat</text>

  <path d="M 710 795 L 710 820 L 200 820 L 200 875" class="line-teal"/>
  <path d="M 710 820 L 500 820 L 500 875" class="line-teal"/>
  <path d="M 710 820 L 800 820 L 800 875" class="line-teal"/>
  <rect x="355" y="800" width="300" height="34" rx="12" fill="#ffffff"/>
  <text x="505" y="822" text-anchor="middle" class="label">MCP connections · gateway only</text>

  <rect x="70" y="875" width="260" height="175" rx="20" fill="#fff4e5" stroke="#ead0a5" stroke-width="2"/>
  <text x="200" y="919" text-anchor="middle" class="card-title">WooCommerce</text>
  <text x="200" y="949" text-anchor="middle" class="body">custom MCP server</text>
  <text x="200" y="990" text-anchor="middle" class="small">Products · orders · status</text>
  <rect x="370" y="875" width="260" height="175" rx="20" fill="#f0eefb" stroke="#d0c9ec" stroke-width="2"/>
  <text x="500" y="919" text-anchor="middle" class="card-title">Inventory MCP</text>
  <text x="500" y="949" text-anchor="middle" class="body">sample upstream</text>
  <text x="500" y="990" text-anchor="middle" class="small">Deterministic sample tools</text>
  <rect x="670" y="875" width="260" height="175" rx="20" fill="#f0eefb" stroke="#d0c9ec" stroke-width="2"/>
  <text x="800" y="919" text-anchor="middle" class="card-title">Shipping MCP</text>
  <text x="800" y="949" text-anchor="middle" class="body">sample upstream</text>
  <text x="800" y="990" text-anchor="middle" class="small">Second server for cross-tool demo</text>

  <path d="M 200 1050 L 200 1100" class="line"/>
  <rect x="91" y="1060" width="218" height="32" rx="10" fill="#ffffff"/>
  <text x="200" y="1082" text-anchor="middle" class="label">WooCommerce REST API</text>
  <rect x="70" y="1100" width="420" height="150" rx="20" fill="#fff9ef" stroke="#ead0a5" stroke-width="2"/>
  <text x="280" y="1144" text-anchor="middle" class="card-title">WordPress + WooCommerce</text>
  <text x="280" y="1175" text-anchor="middle" class="body">Public storefront · private admin</text>
  <text x="280" y="1213" text-anchor="middle" class="small">Storefront is public; MCP service is internal</text>

  <path d="M 880 795 L 940 795 L 940 1315 L 725 1315 L 725 1340" class="line dashed"/>
  <text x="913" y="1085" transform="rotate(-90 913 1085)" text-anchor="middle" class="label">Platform data + audit</text>
  <rect x="550" y="1340" width="350" height="120" rx="20" fill="#edf2f7" stroke="#c5d1dd" stroke-width="2"/>
  <text x="725" y="1384" text-anchor="middle" class="card-title">Platform PostgreSQL</text>
  <text x="725" y="1417" text-anchor="middle" class="body">Users · key hashes · server list · audit</text>

  <path d="M 280 1250 L 280 1340" class="line"/>
  <rect x="70" y="1340" width="420" height="120" rx="20" fill="#edf2f7" stroke="#c5d1dd" stroke-width="2"/>
  <text x="280" y="1384" text-anchor="middle" class="card-title">Persistent store storage</text>
  <text x="280" y="1417" text-anchor="middle" class="body">Database + WordPress files</text>

  <rect x="170" y="1490" width="660" height="70" rx="18" fill="#e8f0f8" stroke="#c5d5e3" stroke-width="2"/>
  <text x="500" y="1533" text-anchor="middle" class="body">Kubernetes Secrets hold credentials · databases use persistent volumes</text>
</svg>
