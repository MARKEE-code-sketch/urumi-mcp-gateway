<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc">
<title id="title">Urumi team MCP platform architecture</title><desc id="desc">Seven application workloads run in Kubernetes behind Traefik. Browser dashboard and external MCP clients reach a combined backend with auth, audit, chat and gateway. Only the gateway calls internal WooCommerce and Inventory MCP servers and external Microsoft Learn or optional Context7. WooCommerce MCP calls WordPress and WooCommerce, backed by MariaDB and a content volume. PostgreSQL persists platform records. Groq is an external language model, not an MCP server. Kubernetes Secrets are supporting cluster resources, not an additional application workload. Credentials are mounted or supplied through environment variables; backend API access is scoped to upstream Secrets. Component icons are original vector illustrations.</desc>
