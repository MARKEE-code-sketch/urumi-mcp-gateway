apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: urumi, app.kubernetes.io/component: woocommerce-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: urumi, app.kubernetes.io/component: woocommerce-mcp}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: woocommerce-mcp
          image: "urumi/woocommerce-mcp:m3"
          imagePullPolicy: IfNotPresent
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: mcp, containerPort: 8000}]
          env:
            - {name: WOO_CANONICAL_ORIGIN, value: "http://shop.urumi.test"}
            - {name: WOO_TRANSPORT_ORIGIN, value: "http://urumi-wordpress.urumi.svc.cluster.local"}
            - {name: WOO_CURRENCY, value: "INR"}
            - {name: MCP_ALLOWED_HOSTS, value: "urumi-woocommerce-mcp,urumi-woocommerce-mcp.urumi.svc,urumi-woocommerce-mcp.urumi.svc.cluster.local"}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef: {name: urumi-woocommerce-rest, key: consumer-key}
            - name: WOO_CONSUMER_SECRET
