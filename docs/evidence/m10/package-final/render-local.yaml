# Source: urumi/templates/store/mariadb.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: urumi-mariadb
spec:
  serviceName: urumi-mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: urumi
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: mariadb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: "mariadb:11.4.13-noble"
          ports:
            - containerPort: 3306
          env:
            - {name: MARIADB_DATABASE, value: woocommerce}
            - {name: MARIADB_USER, value: woocommerce}
            - {name: MARIADB_PASSWORD_FILE, value: /run/urumi/database/database-password}
            - {name: MARIADB_ROOT_PASSWORD_FILE, value: /run/urumi/database/root-password}
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: database, mountPath: /run/urumi/database, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: urumi-mariadb-data
        - name: database
          secret:
            secretName: urumi-store-db
