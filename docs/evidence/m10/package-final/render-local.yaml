# Source: urumi/templates/backend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-backend
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: urumi, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: urumi, app.kubernetes.io/instance: urumi, app.kubernetes.io/component: backend, urumi.dev/gateway: "true"}
    spec:
      serviceAccountName: urumi-backend
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: "urumi/backend:m10-unavailable"
          imagePullPolicy: IfNotPresent
          command: [python, -m, backend.main]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: urumi-backend}}]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: urumi-platform-db, key: password}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: {name: urumi-groq, key: api-key}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {"limits":{"cpu":"1000m","memory":"512Mi"},"requests":{"cpu":"100m","memory":"256Mi"}}
