# Source: urumi/templates/dashboard/resources.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: urumi-dashboard-nginx
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    worker_processes auto;
    events { worker_connections 256; }
    http {
     include /etc/nginx/mime.types;
     default_type application/octet-stream;
     access_log off;
     client_body_temp_path /tmp/client;
     proxy_temp_path /tmp/proxy;
     fastcgi_temp_path /tmp/fastcgi;
     uwsgi_temp_path /tmp/uwsgi;
     scgi_temp_path /tmp/scgi;
     server {
      listen 8080;
      root /usr/share/nginx/html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control no-store always;
      location = /livez { default_type text/plain; return 200 'live\n'; }
      location = /readyz { default_type text/plain; return 200 'ready\n'; }
      location ~ ^/(api|mcp)(/|$) { return 404; }
      location /assets/ { try_files $uri =404; add_header Cache-Control "public,max-age=31536000,immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always; }
      location ~ ^/(login|invite|servers|members|keys|audit|chat)?$ { try_files $uri /index.html; }
      location / { try_files $uri =404; }
     }
    }
